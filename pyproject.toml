[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "genai-risk-audit"
version = "0.1.0"
description = "Evidence-grounded fraud analytics and LLM evaluation on PaySim"
requires-python = ">=3.10"
dependencies = [
  "joblib>=1.3,<1.5",
  "numpy>=1.24,<2",
  "pandas>=2.0,<3",
  "pydantic>=2.0",
  "PyYAML>=6.0",
  "scikit-learn>=1.3,<1.6",
  "streamlit>=1.30,<2",
]

[project.optional-dependencies]
llm = ["openai>=1.30"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

