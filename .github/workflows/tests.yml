name: Product workflow checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements-lock.txt 'pytest>=8,<10'
      - run: python -m pytest -q
      - run: python -m src.evaluation --provider mock --limit 5 --prompt-version grounded_structured --output-dir artifacts/evaluations/ci
